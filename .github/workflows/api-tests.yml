name: API Tests

on:
  push:
    branches: [ main, cinema ]
  pull_request:
    branches: [ main, cinema ]
  workflow_dispatch:

jobs:
  api-tests:
    name: Run API integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Build and start services
        run: |
          docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for events-service..."
          until [ "$(docker inspect -f '{{.State.Health.Status}}' cinemaabyss-events-service)" = "healthy" ]; do
            sleep 5
          done

      - name: Build API test image
        working-directory: tests/postman
        run: docker build -t cinemaabyss-api-tests .

      - name: Run API tests
        run: |
          docker compose run --rm api-tests

      - name: Collect test reports
        if: always()
        run: |
          mkdir -p reports
          docker cp $(docker ps -aqf "ancestor=cinemaabyss-api-tests"):/app/reports ./reports || true

      - name: Stop services
        if: always()
        run: docker compose down -v
